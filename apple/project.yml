name: FormaApple
options:
  bundleIdPrefix: com.formacoach.apple
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
packages:
  FormaCore:
    path: .
targets:
  FormaPhone:
    type: application
    platform: iOS
    sources:
      - iPhone
      - AppShared
      - Resources
      - path: ../assets/exercises/res/drawable-nodpi
        buildPhase: resources
      # Reviewed AI exercise videos (optional until the first clip is added).
      - path: ../assets/exercises/res/raw
        buildPhase: resources
        optional: true
      # Optional rigged USDZ character models exported from Blender/Mixamo.
      - path: ../assets/exercises/res/models
        buildPhase: resources
        optional: true
    dependencies:
      - package: FormaCore
      - target: FormaWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formacoach.apple
        TARGETED_DEVICE_FAMILY: "1,2"
    # Read-only Apple Health import (workouts, body mass). No write/share permission is requested.
    entitlements:
      path: Generated/FormaPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Forma
        NSHealthShareUsageDescription: Forma reads the workouts and body weight you choose to share, to show them next to your own logs. Forma never writes to Apple Health.
        NSCameraUsageDescription: Forma uses the camera only when you tap Scan Barcode to look up packaged food nutrition via Open Food Facts.
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.formacoach.workouts
            UTTypeDescription: Forma workout transfer
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [formaworkouts]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Forma workout transfer
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [com.formacoach.workouts]
  FormaWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - AppShared
      - Resources
      - path: ../assets/exercises/res/drawable-nodpi
        buildPhase: resources
    dependencies:
      - package: FormaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formacoach.apple.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Forma
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.formacoach.apple
        WKRunsIndependentlyOfCompanionApp: true
schemes:
  FormaPhone:
    build:
      targets:
        FormaPhone: all
  FormaWatch:
    build:
      targets:
        FormaWatch: all
