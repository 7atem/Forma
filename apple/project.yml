name: FormaApple
options:
  bundleIdPrefix: com.formacoach.apple
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
packages:
  FormaCore:
    path: .
targets:
  FormaPhone:
    type: application
    platform: iOS
    sources:
      - iPhone
      - AppShared
      - Resources
    dependencies:
      - package: FormaCore
      - target: FormaWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formacoach.apple
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Forma
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.formacoach.workouts
            UTTypeDescription: Forma workout transfer
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [formaworkouts]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Forma workout transfer
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [com.formacoach.workouts]
  FormaWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - AppShared
      - Resources
    dependencies:
      - package: FormaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formacoach.apple.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Forma
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.formacoach.apple
        WKRunsIndependentlyOfCompanionApp: true
schemes:
  FormaPhone:
    build:
      targets:
        FormaPhone: all
  FormaWatch:
    build:
      targets:
        FormaWatch: all
