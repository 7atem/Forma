name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check translations
        run: python3 scripts/check_localization.py
      - name: Check shared exercise and Apple contracts
        run: |
          python3 scripts/generate_exercise_catalog.py --check
          python3 scripts/check_apple_sources.py
          python3 scripts/generate_exercise_guides.py --check
          python3 scripts/check_exercise_art.py
      - name: Test, build and lint
        run: bash ./gradlew :core:coach:test :core:wearables:test :core:backup:test :app:assembleDebug :app:lintDebug :app:assembleRelease --max-workers=1
