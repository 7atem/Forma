name: Apple source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_exercise_catalog.py --check
      - run: python3 scripts/check_apple_sources.py
      - run: python3 scripts/generate_exercise_guides.py --check
      - run: python3 scripts/check_exercise_art.py
      - run: swift test --package-path apple
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apple
      - name: Build FormaPhone (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project apple/FormaApple.xcodeproj -scheme FormaPhone -destination 'generic/platform=iOS Simulator' -derivedDataPath apple/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/phone.log || (grep -E "error:" /tmp/phone.log | head -n 20 | sed 's/^/::error::/'; exit 1)
      - name: Build FormaWatch (watchOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project apple/FormaApple.xcodeproj -scheme FormaWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath apple/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/watch.log || (grep -E "error:" /tmp/watch.log | head -n 20 | sed 's/^/::error::/'; exit 1)
      - name: Build & Package Unsigned IPA (iOS Device ARM64)
        run: |
          set -o pipefail
          xcodebuild -project apple/FormaApple.xcodeproj -scheme FormaPhone -configuration Release -destination 'generic/platform=iOS' -derivedDataPath apple/DerivedDataDevice CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee /tmp/ipa.log || (grep -E "error:" /tmp/ipa.log | head -n 20 | sed 's/^/::error::/'; exit 1)
          APP=apple/DerivedDataDevice/Build/Products/Release-iphoneos/FormaPhone.app
          # Unsigned builds carry no entitlements, so a re-signing tool would drop HealthKit and Apple Health
          # would refuse access. Ad-hoc sign (nested bundles first) to embed them; installers re-sign anyway.
          find "$APP" -mindepth 1 \( -name "*.app" -o -name "*.appex" -o -name "*.framework" \) -print | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- | while read -r nested; do
            codesign --force --sign - --timestamp=none "$nested"
          done
          codesign --force --sign - --timestamp=none --entitlements apple/Generated/FormaPhone.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.healthkit" || { echo "::error::HealthKit entitlement missing from IPA"; exit 1; }
          # The paired-watch install needs the watch app embedded under Watch/; fail loudly if it is not.
          test -f "$APP/Watch/FormaWatch.app/Info.plist" || { echo "::error::FormaWatch.app is not embedded in the IPA"; exit 1; }
          {
            echo "### IPA contents"
            echo "- iPhone app: \`$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")\`"
            echo "- Watch app: \`$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Watch/FormaWatch.app/Info.plist")\` (companion \`$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$APP/Watch/FormaWatch.app/Info.plist")\`)"
            echo "- HealthKit entitlement embedded: yes"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p apple/ipa/Payload
          cp -R "$APP" apple/ipa/Payload/
          (cd apple/ipa && zip -r -y ../FormaPhone-unsigned.ipa Payload)
          ls -lh apple/FormaPhone-unsigned.ipa
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormaPhone-unsigned-ipa
          path: apple/FormaPhone-unsigned.ipa
          if-no-files-found: error
